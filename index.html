<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>點名系統</title>
<style>
  :root {
    --primary: #2563eb;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0; background-color: #f4f5f7; color: var(--gray-900);
    overscroll-behavior-y: none;
    padding-bottom: calc(68px + var(--safe-bottom));
  }

  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    padding-top: max(10px, var(--safe-top));
    padding-left: 14px; padding-right: 14px; padding-bottom: 10px;
  }

  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .app-title { font-size: 18px; font-weight: 700; margin: 0; }

  .sync-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .sync-badge.online { background: var(--success-bg); color: var(--success); }
  .sync-badge.offline { background: var(--danger-bg); color: var(--danger); }
  .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* 模式切換鈕 */
  .mode-switch {
    display: flex; background: var(--gray-200); border-radius: var(--radius-md);
    padding: 3px; margin-bottom: 8px; gap: 2px;
  }
  .mode-btn {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700; color: var(--gray-600); background: transparent;
    cursor: pointer; transition: all 0.2s ease; text-align: center;
  }
  .mode-btn.active-in { background: #10b981; color: #fff; }
  .mode-btn.active-out { background: #6366f1; color: #fff; }

  /* 班別 Tabs */
  .class-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab-btn {
    flex: 1; padding: 7px 0; border-radius: var(--radius-md);
    border: 1px solid var(--gray-200); background: #fff;
    color: var(--gray-600); font-size: 13px; font-weight: 600; text-align: center;
  }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 統計與進度 */
  .stats-card {
    background: #fff; border-radius: var(--radius-md);
    padding: 10px; margin-bottom: 8px; border: 1px solid var(--gray-200);
  }
  .progress-bar-bg { height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }
  .stats-counts { display: flex; justify-content: space-around; font-size: 12px; color: var(--gray-600); }
  .stats-counts b { font-weight: 700; }
  .text-success { color: var(--success); }
  .text-danger { color: var(--danger); }
  .text-gray { color: var(--gray-800); }

  /* 搜尋與過濾 */
  .filter-bar { display: flex; gap: 6px; }
  .search-input {
    flex: 1; padding: 7px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--gray-100);
    font-size: 13px; outline: none;
  }
  .search-input:focus { background: #fff; border-color: var(--primary); }
  .filter-select {
    padding: 7px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--gray-100);
    font-size: 13px; color: var(--gray-800); outline: none;
  }

  /* 列表卡片 */
  .list-container { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .student-card-wrapper { position: relative; border-radius: var(--radius-lg); overflow: hidden; touch-action: pan-y; background: #fff; }

  .swipe-bg {
    position: absolute; inset: 0; display: flex; align-items: center;
    padding: 0 16px; font-weight: 700; font-size: 14px; color: #fff;
    border-radius: var(--radius-lg); opacity: 0;
  }
  .swipe-bg.present { background: var(--success); justify-content: flex-start; }
  .swipe-bg.absent { background: var(--danger); justify-content: flex-end; }

  .student-card {
    position: relative; z-index: 2; background: #fff; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    transition: transform 0.2s ease, background 0.2s ease;
    border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
  }
  .student-card-wrapper.dragging .student-card { transition: none; }
  .student-card-wrapper.is-present .student-card { background: var(--success-bg); border-color: rgba(16, 185, 129, 0.3); }
  .student-card-wrapper.is-absent .student-card { background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.3); }

  /* 未到場學生的鎖定樣式 */
  .student-card-wrapper.locked .student-card {
    background: #f9fafb; opacity: 0.6; border-style: dashed;
  }

  .student-info { display: flex; flex-direction: column; gap: 2px; }
  .student-zh { font-size: 15px; font-weight: 700; color: var(--gray-900); }
  .student-en { font-size: 12px; color: var(--gray-600); }

  .action-area { display: flex; align-items: center; gap: 6px; }
  .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-unmarked { background: var(--gray-100); color: var(--gray-600); }
  .badge-present { background: #d1fae5; color: #047857; }
  .badge-absent { background: #fee2e2; color: #b91c1c; }
  .badge-locked { background: var(--gray-200); color: var(--gray-400); }

  .quick-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
  }
  .btn-check { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
  .btn-cross { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--gray-200); padding: 8px 14px calc(8px + var(--safe-bottom));
  }
  .action-btn {
    width: 100%; padding: 11px; border-radius: var(--radius-md); border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff;
  }
  .empty-state { text-align: center; padding: 30px; color: var(--gray-400); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1 class="app-title">點名系統</h1>
    <div class="sync-badge online" id="syncStatus">
      <span class="dot"></span><span id="syncText">已同步</span>
    </div>
  </div>

  <div class="mode-switch">
    <button class="mode-btn active-in" id="modeInBtn">☀️ 到場點名 (Arrive)</button>
    <button class="mode-btn" id="modeOutBtn">🌙 離場點名 (Leave)</button>
  </div>

  <div class="class-tabs" id="classTabs"></div>

  <div class="stats-card">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
    </div>
    <div class="stats-counts" id="statsCounts">
      <span>出席: <b class="text-success">0</b></span>
      <span>缺席: <b class="text-danger">0</b></span>
      <span>未點: <b class="text-gray">0</b></span>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜尋姓名..." autocomplete="off">
    <select class="filter-select" id="filterSelect">
      <option value="all">全部</option>
      <option value="unmarked">未點名</option>
      <option value="present" id="optPresent">出席</option>
      <option value="absent" id="optAbsent">缺席</option>
    </select>
  </div>
</header>

<div class="list-container" id="listContainer"></div>

<div class="bottom-bar">
  <button class="action-btn" id="btnExport">匯出完整 CSV (含到場與離場)</button>
</div>

/* ========= 2. Firebase Config ========= */
const firebaseConfig = {
  apiKey: "AIzaSyAdNHWlti6Faxqa_JVOEks7R2PLVJlxtEs",
  authDomain: "attendance-2627.firebaseapp.com",
  projectId: "attendance-2627",
  storageBucket: "attendance-2627.firebasestorage.app",
  messagingSenderId: "287751174166",
  appId: "1:287751174166:web:9500c8566e00f758285d37"
};

const CLASSES = [...new Set(STUDENTS.map(s => s.class))];
const DOC_REF_PATH = ["attendance", "activity1"];

let app, db, docRef;
let currentMode = "in"; // "in" = 到場, "out" = 離場
let currentClass = CLASSES[0];
let state = {};
let searchQuery = "";
let filterStatus = "all";

const classTabsEl = document.getElementById("classTabs");
const listContainerEl = document.getElementById("listContainer");
const progressBarEl = document.getElementById("progressBar");
const statsCountsEl = document.getElementById("statsCounts");
const syncStatusEl = document.getElementById("syncStatus");
const syncTextEl = document.getElementById("syncText");
const searchInputEl = document.getElementById("searchInput");
const filterSelectEl = document.getElementById("filterSelect");
const modeInBtn = document.getElementById("modeInBtn");
const modeOutBtn = document.getElementById("modeOutBtn");
const optPresentEl = document.getElementById("optPresent");
const optAbsentEl = document.getElementById("optAbsent");

try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  docRef = doc(db, ...DOC_REF_PATH);
  initRealtimeSync();
} catch (e) {
  updateSyncState(false, "初始化失敗");
}

modeInBtn.onclick = () => {
  currentMode = "in";
  modeInBtn.className = "mode-btn active-in";
  modeOutBtn.className = "mode-btn";
  optPresentEl.textContent = "出席";
  optAbsentEl.textContent = "缺席";
  renderList();
  updateStats();
};
modeOutBtn.onclick = () => {
  currentMode = "out";
  modeInBtn.className = "mode-btn";
  modeOutBtn.className = "mode-btn active-out";
  optPresentEl.textContent = "準備離開";
  optAbsentEl.textContent = "唔見咗";
  renderList();
  updateStats();
};

function triggerHaptic() {
  if ("vibrate" in navigator) navigator.vibrate(10);
}

function renderTabs() {
  classTabsEl.innerHTML = "";
  CLASSES.forEach(c => {
    const btn = document.createElement("button");
    btn.className = `tab-btn ${c === currentClass ? "active" : ""}`;
    btn.textContent = `${c} 班`;
    btn.onclick = () => {
      currentClass = c;
      renderTabs();
      renderList();
      updateStats();
    };
    classTabsEl.appendChild(btn);
  });
}

const getKey = (mode, s, globalIndex) => `${mode}|${s.class}|${globalIndex}`;

function renderList() {
  listContainerEl.innerHTML = "";

  const filtered = STUDENTS.map((s, gi) => ({ student: s, globalIndex: gi }))
    .filter(({ student, globalIndex }) => {
      if (student.class !== currentClass) return false;
      const key = getKey(currentMode, student, globalIndex);
      const st = state[key] || "unmarked";

      if (filterStatus !== "all" && st !== filterStatus) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!student.zh.includes(q) && !student.en.toLowerCase().includes(q)) return false;
      }
      return true;
    });

  if (filtered.length === 0) {
    listContainerEl.innerHTML = `<div class="empty-state">無資料</div>`;
    return;
  }

  filtered.forEach(({ student, globalIndex }) => {
    const inKey = getKey("in", student, globalIndex);
    const isArrived = state[inKey] === "present"; // 檢查該學生到場點名是否為出席

    const key = getKey(currentMode, student, globalIndex);
    const st = state[key];

    const wrapper = document.createElement("div");

    // 如果是「離場模式」且學生未到場，加上 locked 樣式
    const isLocked = (currentMode === "out" && !isArrived);

    wrapper.className = `student-card-wrapper ${isLocked ? "locked" : st === "present" ? "is-present" : st === "absent" ? "is-absent" : ""}`;

    const bgPresent = document.createElement("div");
    bgPresent.className = "swipe-bg present";
    bgPresent.innerHTML = currentMode === "in" ? "到場" : "準備離開";

    const bgAbsent = document.createElement("div");
    bgAbsent.className = "swipe-bg absent";
    bgAbsent.innerHTML = currentMode === "in" ? "缺席" : "唔見咗";

    const card = document.createElement("div");
    card.className = "student-card";

    let badgeHtml = `<span class="status-badge badge-unmarked">未點</span>`;
    if (currentMode === "out" && !isArrived) {
      badgeHtml = `<span class="status-badge badge-locked">未到場(不可點)</span>`;
    } else {
      if (st === "present") badgeHtml = `<span class="status-badge badge-present">${currentMode === "in" ? "到場" : "準備離開"}</span>`;
      if (st === "absent") badgeHtml = `<span class="status-badge badge-absent">${currentMode === "in" ? "缺席" : "唔見咗"}</span>`;
    }

    card.innerHTML = `
      <div class="student-info">
        <div class="student-zh">${student.zh}</div>
        <div class="student-en">${student.en}</div>
      </div>
      <div class="action-area">
        ${badgeHtml}
        ${!isLocked ? '<button class="quick-btn btn-check">✓</button><button class="quick-btn btn-cross">✕</button>' : ''}
      </div>
    `;

    if (!isLocked) {
      card.querySelector(".btn-check").onclick = (e) => { e.stopPropagation(); triggerHaptic(); toggleStatus(key, "present"); };
      card.querySelector(".btn-cross").onclick = (e) => { e.stopPropagation(); triggerHaptic(); toggleStatus(key, "absent"); };
      attachSwipeGesture(wrapper, card, bgPresent, bgAbsent, key);
    }

    wrapper.appendChild(bgPresent);
    wrapper.appendChild(bgAbsent);
    wrapper.appendChild(card);
    listContainerEl.appendChild(wrapper);
  });
}

function attachSwipeGesture(wrapper, card, bgPresent, bgAbsent, key) {
  let startX = 0, startY = 0, currentX = 0, isDragging = false, isHorizontal = null;
  const threshold = 60;

  wrapper.addEventListener("touchstart", e => {
    const touch = e.touches[0];
    startX = touch.clientX; startY = touch.clientY;
    currentX = 0; isDragging = true; isHorizontal = null;
    wrapper.classList.add("dragging");
  }, { passive: true });

  wrapper.addEventListener("touchmove", e => {
    if (!isDragging) return;
    const touch = e.touches[0];
    const diffX = touch.clientX - startX;
    const diffY = touch.clientY - startY;

    if (isHorizontal === null) {
      if (Math.abs(diffX) > 6 || Math.abs(diffY) > 6) {
        isHorizontal = Math.abs(diffX) > Math.abs(diffY);
      }
    }
    if (!isHorizontal) return;

    currentX = Math.max(-120, Math.min(120, diffX));
    card.style.transform = `translateX(${currentX}px)`;

    if (currentX > 0) {
      bgPresent.style.opacity = Math.min(1, currentX / threshold);
      bgAbsent.style.opacity = "0";
    } else {
      bgAbsent.style.opacity = Math.min(1, Math.abs(currentX) / threshold);
      bgPresent.style.opacity = "0";
    }
  }, { passive: true });

  const handleEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    wrapper.classList.remove("dragging");
    card.style.transform = "";
    bgPresent.style.opacity = "0";
    bgAbsent.style.opacity = "0";

    if (isHorizontal && Math.abs(currentX) >= threshold) {
      triggerHaptic();
      toggleStatus(key, currentX > 0 ? "present" : "absent");
    }
  };

  wrapper.addEventListener("touchend", handleEnd);
  wrapper.addEventListener("touchcancel", handleEnd);
}

function toggleStatus(key, targetStatus) {
  state[key] = state[key] === targetStatus ? null : targetStatus;
  if (state[key] === null) delete state[key];
  saveState();
  renderList();
  updateStats();
}

async function saveState() {
  if (!docRef) return;
  try {
    await setDoc(docRef, state);
  } catch (err) {
    updateSyncState(false, "儲存失敗");
  }
}

function initRealtimeSync() {
  onSnapshot(docRef, snap => {
    state = snap.exists() ? snap.data() : {};
    renderList();
    updateStats();
    updateSyncState(true, "已同步");
  }, () => {
    updateSyncState(false, "同步中斷");
  });
}

function updateSyncState(isOnline, text) {
  syncStatusEl.className = `sync-badge ${isOnline ? "online" : "offline"}`;
  syncTextEl.textContent = text;
}

function updateStats() {
  const list = STUDENTS.map((s, gi) => ({ student: s, key: getKey(currentMode, s, gi), globalIndex: gi }))
    .filter(x => {
      if (x.student.class !== currentClass) return false;
      if (currentMode === "out") {
        const inKey = getKey("in", x.student, x.globalIndex);
        return state[inKey] === "present";
      }
      return true;
    });

  const total = list.length;
  let present = 0, absent = 0;

  list.forEach(x => {
    if (state[x.key] === "present") present++;
    if (state[x.key] === "absent") absent++;
  });

  const percent = total > 0 ? Math.round(((present + absent) / total) * 100) : 0;
  progressBarEl.style.width = `${percent}%`;

  statsCountsEl.innerHTML = `
    <span>${currentMode === 'in' ? '到場' : '準備離開'}: <b class="text-success">${present}</b></span>
    <span>${currentMode === 'in' ? '缺席' : '唔見咗'}: <b class="text-danger">${absent}</b></span>
    <span>未點: <b class="text-gray">${total - present - absent}</b></span>
  `;
}

searchInputEl.oninput = (e) => { searchQuery = e.target.value.trim(); renderList(); };
filterSelectEl.onchange = (e) => { filterStatus = e.target.value; renderList(); };

document.getElementById("btnExport").onclick = () => {
  const rows = [["Class", "Chinese Name", "English Name", "Arrive Status", "Leave Status"]];
  STUDENTS.forEach((s, gi) => {
    const inSt = state[getKey("in", s, gi)];
    const outSt = state[getKey("out", s, gi)];
    rows.push([
      s.class, s.zh, s.en,
      inSt === "present" ? "Arrived" : inSt === "absent" ? "Absent" : "Not marked",
      inSt !== "present" ? "Did not arrive" : (outSt === "present" ? "Ready to go" : outSt === "absent" ? "Missing" : "Not marked")
    ]);
  });

  const csvContent = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `attendance_full_${new Date().toISOString().split("T")[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

renderTabs();
renderList();
updateStats();
</script>
</body>
</html>
